name = "workout-tracker"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "workout-tracker-db"
database_id = "local-dev-id"

[[kv_namespaces]]
binding = "SESSIONS"
id = "local-kv-id"
